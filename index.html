<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>H.A.R.A</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true;">
    
    <a-entity light="type: ambient; color: #FFF; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.2" position="-1 2 1"></a-entity>

    <a-entity camera deviceOrientationControlsEnabled="false">
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactuable"></a-entity>
    </a-entity>

    <a-marker type="pattern" url="Ave.patt">
        <a-gltf-model src="Acertijo1A.glb" 
                      class="interactuable"
                      scale="0.5 0.5 0.5" 
                      position="0 0 0"
                      rotation="-90 0 0"> </a-gltf-model>
    </a-marker>

    <a-marker type="pattern" url="Rabbit.patt">
        <a-gltf-model src="Acertijo2R.glb" 
                      class="interactuable"
                      scale="0.5 0.5 0.5" 
                      position="0 0.5 0"
                      rotation="-90 0 0">
        </a-gltf-model>
    </a-marker>

    <a-marker type="pattern" url="Pescado.patt">
        <a-gltf-model src="Acertijo3P.glb" 
                      class="interactuable"
                      scale="0.5 0.5 0.5" 
                      position="0 0.5 0"
                      rotation="-90 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>


    <a-marker type="pattern" url="Delfin.patt">
        <a-gltf-model src="Acertijo4D.glb" 
                      class="interactuable"
                      scale="0.5 0.5 0.5" 
                      position="0 0.5 0"
                      rotation="-90 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>


    <a-marker type="pattern" url="Gato.patt">
        <a-gltf-model src="Acertijo5G.glb" 
                      class="interactuable"
                      scale="0.5 0.5 0.5" 
                      position="0 0.5 0"
                      rotation="-90 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>


    <a-marker type="pattern" url="Caballo.patt">
        <a-gltf-model src="Presentacion.glb" 
                      class="interactuable"
                      scale="0.5 0.5 0.5" 
                      position="0 0.5 0"
                      rotation="-90 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>

    <a-marker type="pattern" url="Perro.patt">
        <a-gltf-model src="Acertijo6C.glb" 
                      class="interactuable"
                      scale="0.5 0.5 0.5" 
                      position="0 0.5 0"
                      rotation="-90 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>

    

  </a-scene>
</body>
</html>
