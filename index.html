<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cofre ADSO - RA Múltiple Fija Perfecta</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('guardar-posicion', {
      init: function () {
        var marker = this.el;
        var sceneEl = document.querySelector('a-scene');

        marker.addEventListener('markerFound', function() {
          var model = marker.querySelector('a-gltf-model');

          if (model && !model.classList.contains('fijado')) {
            model.classList.add('fijado');

            // 1. Forzar el cálculo de la posición real en este milisegundo
            model.object3D.updateMatrixWorld(true);

            // 2. Extraer posición, rotación y escala de la hoja física
            var position = new THREE.Vector3();
            var quaternion = new THREE.Quaternion();
            var scale = new THREE.Vector3();
            model.object3D.matrixWorld.decompose(position, quaternion, scale);

            // 3. Crear el clon independiente
            var clonModel = document.createElement('a-gltf-model');
            clonModel.setAttribute('src', model.getAttribute('src'));
            clonModel.setAttribute('class', 'interactuable');
            clonModel.setAttribute('animation-mixer', model.getAttribute('animation-mixer'));

            // 4. TRUCO CLAVE: Aplicar las coordenadas reales ANTES de meterlo a la escena
            clonModel.object3D.position.copy(position);
            clonModel.object3D.quaternion.copy(quaternion);
            clonModel.object3D.scale.copy(scale);
            
            // Congelamos su matriz inmediatamente para que no se mueva con la cámara
            clonModel.object3D.matrixAutoUpdate = false;

            // 5. Ahora sí, lo soltamos en el mundo real
            sceneEl.appendChild(clonModel);

            // 6. Apagamos el modelo original que parpadeaba dentro del marcador
            model.setAttribute('visible', false);
            
            console.log("¡Objeto sembrado correctamente en las coordenadas del marcador!");
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true;">
    
    <a-entity light="type: ambient; color: #FFF; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.2" position="-1 2 1"></a-entity>

    <a-entity camera="far: 10000; near: 0.1;"></a-entity>

    <a-marker type="pattern" url="A.patt" guardar-posicion>
        <a-gltf-model src="Mimic.glb" 
                      scale="2 2 2" 
                      position="0 0 0"
                      rotation="-90 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>

    <a-marker type="pattern" url="B.patt" guardar-posicion>
        <a-gltf-model src="Snake.glb" 
                      scale="0.5 0.5 0.5" 
                      position="0 0.5 0"
                      rotation="-90 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>

    <a-marker type="pattern" url="C.patt" guardar-posicion>
        <a-gltf-model src="Nucleo6.glb" 
                      scale="0.2 0.2 0.2" 
                      position="0 0.5 0"
                      rotation="0 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>

  </a-scene>
</body>
</html>
