<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cofre ADSO - RA Inteligente</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('guardar-posicion', {
      init: function () {
        var marker = this.el;
        var model = marker.querySelector('a-gltf-model');

        // Cuando la cámara encuentra la hoja por primera vez
        marker.addEventListener('markerFound', function() {
          // Cambiamos el modelo para que ya no dependa de la hoja física
          if (model && !model.classList.contains('fijado')) {
            // Le decimos al motor que mantenga el objeto visible para siempre
            model.setAttribute('visible', true);
            model.classList.add('fijado');
          }
        });

        // Truco de magia: Bloqueamos la orden de AR.js de ocultar el objeto
        marker.addEventListener('markerLost', function(e) {
          if (model && model.classList.contains('fijado')) {
            // Forzamos a que siga visible e inmóvil en el espacio
            model.setAttribute('visible', true);
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true;">
    
    <a-entity light="type: ambient; color: #FFF; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.2" position="-1 2 1"></a-entity>

    <a-entity camera></a-entity>

    <a-marker type="pattern" url="C.patt" guardar-posicion>
        <a-gltf-model src="NucleoLimpio.glb" 
                      class="interactuable"
                      scale="0.2 0.2 0.2" 
                      position="0 0.5 0"
                      rotation="0 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>

  </a-scene>
</body>
</html>
