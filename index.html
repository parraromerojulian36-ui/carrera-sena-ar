<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cofre ADSO - RA Inteligente</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('guardar-posicion', {
      init: function () {
        var marker = this.el;
        var sceneEl = document.querySelector('a-scene');

        marker.addEventListener('markerFound', function() {
          var model = marker.querySelector('a-gltf-model');

          // Si el modelo original existe y no hemos creado el clon persistente todavía
          if (model && !marker.classList.contains('copiado')) {
            marker.classList.add('copiado'); // Marcamos el marcador para que no repita este proceso

            // Creamos una nueva entidad idéntica en la escena global
            var nuevoModelo = document.createElement('a-gltf-model');
            
            // Le copiamos exactamente todos los atributos del original
            nuevoModelo.setAttribute('src', model.getAttribute('src'));
            nuevoModelo.setAttribute('class', model.getAttribute('class'));
            nuevoModelo.setAttribute('scale', model.getAttribute('scale'));
            nuevoModelo.setAttribute('animation-mixer', model.getAttribute('animation-mixer'));
            
            // Calculamos la posición exacta en el mundo real en ese preciso segundo
            var posicionMundo = new THREE.Vector3();
            model.object3D.updateMatrixWorld();
            model.object3D.getWorldPosition(posicionMundo);
            
            // Asignamos la posición fija basada en el mundo real
            nuevoModelo.setAttribute('position', posicionMundo.x + ' ' + (posicionMundo.y + 0.5) + ' ' + posicionMundo.z);
            nuevoModelo.setAttribute('rotation', '0 0 0');

            // Añadimos el nuevo objeto directamente a la escena (fuera del marcador)
            sceneEl.appendChild(nuevoModelo);

            // Ocultamos el modelo original del marcador para que no se duplique visualmente
            model.setAttribute('visible', false);
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true;">
    
    <a-entity light="type: ambient; color: #FFF; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.2" position="-1 2 1"></a-entity>

    <a-entity camera></a-entity>

    <a-marker type="pattern" url="C.patt" guardar-posicion>
        <a-gltf-model src="Nucleo6.glb" 
                      class="interactuable"
                      scale="0.2 0.2 0.2" 
                      position="0 0.5 0"
                      rotation="0 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>

  </a-scene>
</body>
</html>
