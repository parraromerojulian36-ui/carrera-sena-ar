<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cofre ADSO - RA Inteligente Estática</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('guardar-posicion', {
      init: function () {
        var marker = this.el;
        var model = marker.querySelector('a-gltf-model');

        // Cuando la cámara encuentra la hoja por primera vez
        marker.addEventListener('markerFound', function() {
          if (model && !model.classList.contains('fijado')) {
            // Marcamos el modelo como fijado
            model.classList.add('fijado');
            
            // Forzamos a que su matriz de transformación se vuelva independiente del marcador
            // Esto hace que capture su posición en el "mundo real" y no cambie más
            model.object3D.matrixAutoUpdate = false;
            
            console.log("¡Lugar detectado! Objeto congelado en el espacio físico.");
          }
        });

        // Cuando la cámara pierde la hoja, evitamos que AR.js oculte o mueva el objeto
        marker.addEventListener('markerLost', function(e) {
          if (model && model.classList.contains('fijado')) {
            // Forzamos la visibilidad activa
            model.setAttribute('visible', true);
            
            // Obligamos a Three.js a mantener la última posición calculada en la habitación
            model.object3D.visible = true;
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true;">
    
    <a-entity light="type: ambient; color: #FFF; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 1.2" position="-1 2 1"></a-entity>

    <a-entity camera></a-entity>

    <a-marker type="pattern" url="C.patt" guardar-posicion>
        <a-gltf-model src="Nucleo6.glb" 
                      class="interactuable"
                      scale="0.2 0.2 0.2" 
                      position="0 0.5 0"
                      rotation="0 0 0"
                      animation-mixer> 
        </a-gltf-model>
    </a-marker>

  </a-scene>
</body>
</html>
